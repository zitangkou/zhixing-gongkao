name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-lint:
    name: 前端 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-test:
    name: 后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  admin-build:
    name: 管理后台构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
