# 知行公考 · 宿主机 Nginx 网关（方案 B：按域名转发到项目容器）
#
# 适用：一台云服务器上同时跑多个项目；本项目容器只监听 127.0.0.1 内网端口，
#       公网 80/443 由宿主机 Nginx 统一入口，按 server_name 转发。
#
# 使用：
#   cp deploy/nginx.conf /etc/nginx/sites-available/zhixing-gongkao
#   ln -sf /etc/nginx/sites-available/zhixing-gongkao /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 注意：代理目标端口必须与 .env 的 HTTP_PORT 一致（默认 8081）。
#       HTTPS：certbot --nginx -d zhixinggk.ltd 即可自动补证书并跳转。

server {
    listen 80;
    server_name zhixinggk.ltd;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # H5 静态页面（容器内 nginx 负责 try_files）
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 学员端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # 管理端 API（JWT + RBAC）
    location /admin/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台静态页（FastAPI 挂载 server/admin-dist）
    location /manage/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件（头像 / 错题图，容器内直接 alias data/uploads）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查 / API 文档
    location ~ ^/(health|docs|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
